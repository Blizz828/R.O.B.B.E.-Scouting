    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <footer>
      <small>Simple scouting pages — add content as needed.</small>

    <!-- Global Storage Sync System -->
    <script src="storageSync.js"></script>
    <script src="globalStorageAdapter.js"></script>
    
    <!-- App Logic -->
    <script src="app.js"></script>
    
    <!-- App-specific Storage Sync -->
    <script src="appStorageSync.js"></script>
    
    <!-- Initialize global storage on page load -->
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        // Initialize the global storage adapter
        await globalStorageAdapter.init({ autoPull: true, overwrite: false });
        
        // Initialize app-specific storage sync
        await appStorageSync.init();
        appStorageSync.hookAppFunctions();
        
        console.log('Global storage initialized on index.html');
      });
    </script>
  </body>
